name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Fails the deploy if poems.json or sitemap.xml no longer match poems/.
      - name: Check generated files are current
        run: node tools/build-content.mjs --check
      # Renders every poem's link-preview card with the runner's Chrome and
      # points og:image at it. Never fails the deploy: a card that can't be
      # made leaves its page on the default image (see ADR-0013).
      - name: Render link-preview cards
        run: node tools/build-share-cards.mjs --stamp
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
